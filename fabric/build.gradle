import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.fabricmc.fabric-loom'
    id 'multiloader-loader'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.+"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation group: 'info.journeymap', name: 'journeymap-api-fabric',
            version: "${journeymap_api_version}", changing: true

    compileOnly group: 'mysticdrew', name: 'common-networking-fabric',
            version: "${common_networking_version}-${common_networking_mc_version}", changing: true

    compileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") {
        exclude group: 'me.shedaniel'
    }
    compileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") {
        exclude group: 'me.shedaniel'
    }

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}

// Automated upload to CurseForge for the win!
if (!project.hasProperty("curseForgeApiKey")) {
    ext.curseForgeApiKey = project.findProperty("curseforge_api_key") ?: "notset"
}
if (!project.hasProperty("modrinthApiKey")) {
    ext.modrinthApiKey = project.findProperty("modrinth_api_key") ?: "notset"
}

task processDocs(type: Copy) {
    from(file("$rootDir/doc/")) {
        include '*.html'
        expand 'version': project.version,
                'date': new Date().format('yyyy-MM-dd'),
                'mcversion': project.minecraft_version,
                'loaderversion': project.fabric_loader_version,
                'loadername': "Fabric"
    }
    into layout.buildDirectory.dir("doc")
}

def publishJar = tasks.named("jar")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    dependsOn processDocs
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, publishJar)
    mainFile.displayName = "${project.mod_id}-${version}+${project.name}"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Fabric", "Quilt")
    mainFile.addJavaVersion("Java 25")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRelation("journeymap", "requiredDependency")
    mainFile.changelogType = "html"
    mainFile.changelog = file(layout.buildDirectory.dir("doc").get().asFile.path + "/changelog.html")
}

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}+${project.name}"
    versionName = "${project.mod_id}-${version}+${project.name}"
    versionType = release_type
    uploadFile = publishJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["fabric", "quilt"]
    def changelogFile = layout.buildDirectory.dir("doc").get().file("changelog.html").asFile
    changelog = changelogFile.exists() ? changelogFile.text : null
    dependencies {
        required.project "journeymap"
    }
}
